# yaml-language-server: $schema=/Users/wphongphanpa/repositories/personal/pi-workflows/schemas/workflow.schema.json
version: 1
id: ticket
command: ticket
description: Read a Jira ticket, plan, implement, and independently verify it
start: plan
maxStepVisits: 20
summaryMaxChars: 30000
steps:
  plan:
    title: Read Jira evidence and plan
    prompt:
      file: steps/ticket/plan.md
    subagent:
      agent: scout
      context: fresh
      timeoutMs: 1200000
      retryToolFailures: true
      turnBudget:
        maxTurns: 35
        graceTurns: 3
      toolBudget:
        soft: 80
        hard: 140
        block: "*"
    permissions:
      tools: [read, ls, bash]
      mcp: &ticket-mcp
        - atlassian/getAccessibleAtlassianResources
        - atlassian/getJiraIssue
        - atlassian/getJiraIssueRemoteIssueLinks
        - atlassian/searchJiraIssuesUsingJql
        - context7/resolve-library-id
        - context7/query-docs
        - sourcegraph/code_finder
        - sourcegraph/commit_search
        - sourcegraph/diff_search
        - sourcegraph/keyword_search
        - sourcegraph/list_files
        - sourcegraph/list_repos
        - sourcegraph/nls_search
        - sourcegraph/read_file
        - gh_grep/searchGitHub
      extensions: [pi-web-tools]
      skills:
        &ticket-plan-skills [
          caveman,
          jira-ticket,
          coding-standards,
          brainstorming,
        ]
      bash:
        mode: read-only
    requires:
      tools: [read, ls, bash, mcp]
      skills: *ticket-plan-skills
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 10000
    transitions:
      approved: implement
      changes-requested: plan
      retry: plan
      blocked: $pause
  implement:
    title: Implement the approved Jira plan
    prompt:
      file: steps/ticket/implement.md
    subagent:
      agent: worker
      context: fresh
      timeoutMs: 7200000
      artifacts: true
      retryToolFailures: true
      turnBudget:
        maxTurns: 90
        graceTurns: 5
      toolBudget:
        soft: 260
        hard: 440
        block: "*"
    permissions:
      tools: [read, ls, bash, edit, write]
      mcp: *ticket-mcp
      skills:
        &ticket-implement-skills [
          caveman,
          jira-ticket,
          coding-standards,
          systematic-debugging,
          test-driven-development,
          verification-before-completion,
          receiving-code-review,
        ]
      bash:
        mode: allow-list
        allow: &ticket-inspection-bash
          - executable: grep
          - executable: head
          - executable: ls
          - executable: pwd
          - executable: rg
          - executable: stat
          - executable: tail
          - executable: wc
          - executable: git
            argsPrefixes:
              [[status], [diff], [grep], [log], [ls-files], [rev-parse], [show]]
        approvedSources: [verification-worker]
        handoffSources: [verification-worker, verification-reviewer]
    requires:
      tools: [read, ls, bash, edit, write, mcp]
      skills: *ticket-implement-skills
    transitions:
      ready: verify
      retry: implement
      blocked: $pause
  verify:
    title: Independently verify Jira work
    prompt:
      file: steps/ticket/verify.md
    subagent:
      agent: reviewer
      context: fresh
      timeoutMs: 3600000
      retryToolFailures: true
      turnBudget:
        maxTurns: 40
        graceTurns: 3
      toolBudget:
        soft: 120
        hard: 200
        block: "*"
    permissions:
      tools: [read, ls, bash]
      mcp: *ticket-mcp
      skills:
        &ticket-verify-skills [
          caveman,
          jira-ticket,
          coding-standards,
          verification-before-completion,
        ]
      bash:
        mode: allow-list
        allow: *ticket-inspection-bash
        approvedSources: [verification-reviewer]
        handoffSources: [verification-worker, verification-reviewer]
    requires:
      tools: [read, ls, bash, mcp]
      skills: *ticket-verify-skills
    transitions:
      passed: $done
      failed: implement
      retry: verify
      blocked: $pause
