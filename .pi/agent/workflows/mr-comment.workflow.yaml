# yaml-language-server: $schema=/Users/wphongphanpa/repositories/personal/pi-workflows/schemas/workflow.schema.json
version: 1
id: mr-comment
command: mr-comment
description: Triage unresolved GitLab MR comments, implement fixes, verify, and optionally publish
start: plan
maxStepVisits: 10
summaryMaxChars: 30000
steps:
  plan:
    title: Triage unresolved review comments
    prompt:
      file: steps/mr-comment/plan.md
    subagent:
      agent: scout
      context: fresh
      timeoutMs: 1800000
      retryToolFailures: true
      turnBudget:
        maxTurns: 45
        graceTurns: 3
      toolBudget:
        soft: 120
        hard: 200
        block: "*"
    permissions:
      tools: [read, ls, bash]
      mcp: &comment-mcp
        - gitlab/get_merge_request
        - gitlab/get_merge_request_commits
        - gitlab/get_merge_request_diffs
        - gitlab/get_merge_request_pipelines
        - gitlab/get_pipeline_jobs
        - gitlab/get_merge_request_conflicts
        - gitlab/search
        - context7/resolve-library-id
        - context7/query-docs
        - sourcegraph/code_finder
        - sourcegraph/commit_search
        - sourcegraph/diff_search
        - sourcegraph/keyword_search
        - sourcegraph/list_files
        - sourcegraph/list_repos
        - sourcegraph/nls_search
        - sourcegraph/read_file
        - gh_grep/searchGitHub
      extensions: [pi-web-tools]
      skills:
        &comment-plan-skills [
          caveman,
          receiving-code-review,
          coding-standards,
          brainstorming,
        ]
      bash:
        mode: allow-list
        allow: &comment-inspection-bash
          - executable: grep
          - executable: head
          - executable: ls
          - executable: pwd
          - executable: rg
          - executable: stat
          - executable: tail
          - executable: wc
          - executable: git
            argsPrefixes:
              [[status], [diff], [grep], [log], [ls-files], [rev-parse], [show]]
          - executable: glab
            argsPrefixes: [[mr, view], [mr, diff], [api]]
    requires:
      tools: [read, ls, bash]
      skills: *comment-plan-skills
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 10000
    transitions:
      approved: implement
      changes-requested: plan
      retry: plan
      blocked: $pause
  implement:
    title: Implement approved review-comment fixes
    prompt:
      file: steps/mr-comment/implement.md
    subagent:
      agent: worker
      context: fresh
      timeoutMs: 7200000
      artifacts: true
      retryToolFailures: true
      turnBudget:
        maxTurns: 90
        graceTurns: 5
      toolBudget:
        soft: 260
        hard: 440
        block: "*"
    permissions:
      tools: [read, ls, bash, edit, write]
      mcp: *comment-mcp
      skills:
        &comment-implement-skills [
          caveman,
          receiving-code-review,
          coding-standards,
          systematic-debugging,
          test-driven-development,
          verification-before-completion,
        ]
      bash:
        mode: allow-list
        allow: *comment-inspection-bash
        approvedSources: [verification-worker]
    requires:
      tools: [read, ls, bash, edit, write]
      skills: *comment-implement-skills
    transitions:
      ready: verify
      retry: implement
      replan: plan
      blocked: $pause
  verify:
    title: Independently verify review-comment handling
    prompt:
      file: steps/mr-comment/verify.md
    subagent:
      agent: reviewer
      context: fresh
      timeoutMs: 3600000
      retryToolFailures: true
      turnBudget:
        maxTurns: 45
        graceTurns: 3
      toolBudget:
        soft: 140
        hard: 240
        block: "*"
    permissions:
      tools: [read, ls, bash]
      mcp: *comment-mcp
      skills:
        &comment-verify-skills [
          caveman,
          receiving-code-review,
          coding-standards,
          caveman-review,
          systematic-debugging,
          verification-before-completion,
        ]
      bash:
        mode: allow-list
        allow: *comment-inspection-bash
        approvedSources: [verification-reviewer]
    requires:
      tools: [read, ls, bash]
      skills: *comment-verify-skills
    transitions:
      ready: confirm
      no-actions: $done
      failed: implement
      retry: verify
      replan: plan
      blocked: $pause
  confirm:
    title: Confirm exact push and reply actions
    prompt:
      file: steps/mr-comment/confirm.md
    subagent:
      agent: reviewer
      context: fresh
      timeoutMs: 900000
      turnBudget:
        maxTurns: 15
        graceTurns: 2
      toolBudget:
        soft: 10
        hard: 20
        block: "*"
    permissions:
      skills: [caveman, receiving-code-review]
    requires:
      skills: [caveman, receiving-code-review]
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 10000
    transitions:
      approved: publish
      changes-requested: plan
      no-actions: $done
      retry: confirm
      replan: plan
      blocked: $pause
  publish:
    title: Run confirmed push and reply actions
    prompt:
      file: steps/shared/publish-remote.md
    subagent:
      agent: worker
      context: fresh
      timeoutMs: 1800000
      retryToolFailures: true
      turnBudget:
        maxTurns: 25
        graceTurns: 2
      toolBudget:
        soft: 50
        hard: 80
        block: "*"
    permissions:
      tools: [bash]
      skills: [caveman, receiving-code-review]
      bash:
        mode: allow-list
        allow:
          - executable: git
            argsPrefixes: [[status], [rev-parse], [show], [ls-remote]]
          - executable: glab
            argsPrefixes: [[mr, view], [api]]
        approvedSources: [remote-actions]
    requires:
      tools: [bash]
      skills: [caveman, receiving-code-review]
    transitions:
      published: $done
      retry: publish
      replan: plan
      blocked: $pause
