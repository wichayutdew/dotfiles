version: 1
id: mr-review
command: mr-review
description: Fetch, approve, publish, and verify one hosted code review
start: fetch
maxStepVisits: 10
summaryMaxChars: 50000
steps:
  fetch:
    title: Fetch complete hosted-review evidence
    prompt:
      file: steps/mr-review/fetch.md
    agent: scout
    permissions: &a1
      tools:
        - read
        - ls
        - bash
        - edit
        - write
        - mcp
      mcp:
        - context7
        - atlassian
        - gitlab
        - figma
        - agoda_skills
        - glean
        - sourcegraph
        - grafana
        - slack
        - gh_grep
        - superset
      extensions:
        - /
      skills:
        - brainstorming
        - cavecrew
        - caveman
        - coding-standards
        - commit-format
        - dispatching-parallel-agents
        - executing-plans
        - finishing-a-development-branch
        - grafana-logs
        - jira-ticket
        - lint-commands
        - mcp-scripting
        - receiving-code-review
        - requesting-code-review
        - search-code-sourcegraph
        - start-on-call
        - start-triage
        - subagent-driven-development
        - systematic-debugging
        - test-driven-development
        - using-git-worktrees
        - using-superpowers
        - verification-before-completion
        - writing-plans
        - writing-skills
      bash:
        mode: unrestricted
    transitions:
      fetched: review
      blocked: $pause
  review:
    title: Produce and approve the complete hosted review
    prompt:
      file: steps/mr-review/review-for-approval.md
    agent: reviewer
    permissions: *a1
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 30000
    transitions:
      approved: publish
      changes-requested: review
      blocked: $pause
  publish:
    title: Publish the approved hosted review
    prompt:
      file: steps/mr-review/publish-approved.md
    agent: worker
    permissions: *a1
    transitions:
      published: verify
      blocked: $pause
  verify:
    title: Verify or return the approved review for publication repair
    prompt:
      file: steps/mr-review/verify-published.md
    agent: reviewer
    permissions: *a1
    transitions:
      verified: $done
      failed: publish
      retry: verify
      blocked: verify
