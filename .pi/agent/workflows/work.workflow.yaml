# yaml-language-server: $schema=/Users/wphongphanpa/repositories/personal/pi-workflows/schemas/workflow.schema.json
version: 1
id: work
command: work
description: Plan, implement, and independently verify local work
start: plan
maxStepVisits: 20
summaryMaxChars: 30000
steps:
  plan:
    title: Explore and plan local work
    prompt:
      file: steps/work/plan.md
    subagent:
      agent: scout
      context: fresh
      timeoutMs: 1200000
      retryToolFailures: true
      turnBudget:
        maxTurns: 30
        graceTurns: 3
      toolBudget:
        soft: 60
        hard: 100
        block: "*"
    permissions:
      tools: [read, ls, bash]
      mcp: &work-mcp
        - context7/resolve-library-id
        - context7/query-docs
        - sourcegraph/code_finder
        - sourcegraph/commit_search
        - sourcegraph/diff_search
        - sourcegraph/keyword_search
        - sourcegraph/list_files
        - sourcegraph/list_repos
        - sourcegraph/nls_search
        - sourcegraph/read_file
        - gh_grep/searchGitHub
      extensions: [pi-web-tools]
      skills: &work-plan-skills [caveman, brainstorming, coding-standards]
      bash:
        mode: read-only
    requires:
      tools: [read, ls, bash]
      skills: *work-plan-skills
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 10000
    transitions:
      approved: implement
      changes-requested: plan
      retry: plan
      blocked: $pause
  implement:
    title: Implement the approved local plan
    prompt:
      file: steps/work/implement.md
    subagent:
      agent: worker
      context: fresh
      timeoutMs: 7200000
      artifacts: true
      retryToolFailures: true
      turnBudget:
        maxTurns: 80
        graceTurns: 5
      toolBudget:
        soft: 240
        hard: 400
        block: "*"
    permissions:
      tools: [read, ls, bash, edit, write]
      mcp: *work-mcp
      skills:
        &work-implement-skills [
          caveman,
          coding-standards,
          systematic-debugging,
          test-driven-development,
          verification-before-completion,
          receiving-code-review,
        ]
      bash:
        mode: allow-list
        allow: &work-inspection-bash
          - executable: grep
          - executable: head
          - executable: ls
          - executable: pwd
          - executable: rg
          - executable: stat
          - executable: tail
          - executable: wc
          - executable: git
            argsPrefixes:
              [[status], [diff], [grep], [log], [ls-files], [rev-parse], [show]]
        approvedSources: [verification-worker]
        handoffSources: [verification-worker, verification-reviewer]
    requires:
      tools: [read, ls, bash, edit, write]
      skills: *work-implement-skills
    transitions:
      ready: verify
      retry: implement
      blocked: $pause
  verify:
    title: Independently verify local work
    prompt:
      file: steps/work/verify.md
    subagent:
      agent: reviewer
      context: fresh
      timeoutMs: 3600000
      retryToolFailures: true
      turnBudget:
        maxTurns: 40
        graceTurns: 3
      toolBudget:
        soft: 120
        hard: 200
        block: "*"
    permissions:
      tools: [read, ls, bash]
      mcp: *work-mcp
      skills:
        &work-verify-skills [
          caveman,
          coding-standards,
          verification-before-completion,
        ]
      bash:
        mode: allow-list
        allow: *work-inspection-bash
        approvedSources: [verification-reviewer]
        handoffSources: [verification-worker, verification-reviewer]
    requires:
      tools: [read, ls, bash]
      skills: *work-verify-skills
    transitions:
      passed: $done
      failed: implement
      retry: verify
      blocked: $pause
