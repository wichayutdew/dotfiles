version: 1
id: work
command: work
description: "Plan, implement, verify, and publish local work or a Jira-backed requirement."
start: intake
maxStepVisits: 20
summaryMaxChars: 30000
steps:
  intake:
    title: Normalize requirement and optional Jira evidence
    prompt: {file: steps/work/intake.md}
    agent: planner
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian]
      extensions: [/]
      skills: [using-superpowers, caveman]
      bash: {mode: unrestricted}
    transitions: {ready: plan, retry: intake, blocked: $pause}
  plan:
    title: Explore and approve local work
    prompt: {file: steps/work/plan.md}
    agent: planner
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian, context7, sourcegraph, glean, gh_grep, github/get_file_contents, gitlab]
      extensions: [/]
      skills: [using-superpowers, caveman, ponytail]
      bash: {mode: unrestricted}
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 30000
      artifactContract:
        maxChars: 10000
        requiredSubstrings: ["## Goal/Acceptance Criteria", "## Non Goal", "## Implementation Steps and Tests", "## Validation", "## Risks/Decisions Needed", "## Publications Contract/Metadata", "## Execution appendix (machine-readable)"]
        forbiddenSubstrings: ["The complete gate artifact is the exact Markdown saved at"]
        onValidationFailure: retry
    transitions: {approved: prepare-workspace, changes-requested: plan, retry: plan, blocked: $pause}
  prepare-workspace:
    title: Prepare approved branch and worktree
    prompt: {file: steps/shared/prepare-workspace.md}
    agent: workspace-preparer
    workspace:
      bindOn: [ready]
      allowedRoots: [~/repositories/worktrees]
    permissions:
      tools: [read, ls, bash]
      mcp: []
      extensions: [/]
      skills: [using-superpowers, using-git-worktrees, caveman]
      bash: {mode: unrestricted}
    transitions: {ready: implement, workspace-refresh: plan, retry: prepare-workspace, blocked: $pause}
  implement:
    title: Implement approved work
    prompt: {file: steps/work/implement.md}
    agent: worker
    permissions:
      tools: [read, ls, bash, edit, write, mcp]
      mcp: [context7]
      extensions: [/]
      skills: [using-superpowers, caveman, test-driven-development, systematic-debugging]
      bash: {mode: unrestricted}
    transitions: {ready: verify, retry: implement, blocked: $pause}
  verify:
    title: Independently verify local work
    prompt: {file: steps/work/verify.md}
    agent: reviewer
    permissions:
      tools: [read, ls, bash]
      mcp: []
      extensions: [/]
      skills: [using-superpowers, caveman, verification-before-completion, caveman-review, ponytail-review]
      bash: {mode: unrestricted}
    transitions: {passed: publish, failed: implement, retry: verify, blocked: verify}
  publish:
    title: Publish verified branch and open review
    prompt: {file: steps/work/publish-remote.md}
    agent: worker
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [gitlab, github/pull_request_read, github/create_pull_request, github/update_pull_request]
      extensions: [/]
      skills: [using-superpowers, caveman, verification-before-completion]
      bash: {mode: unrestricted}
    transitions: {published: $done, retry: publish, blocked: $pause}
