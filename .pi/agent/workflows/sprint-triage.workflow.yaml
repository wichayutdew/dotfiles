version: 1
id: sprint-triage
command: sprint-triage
description: "Date range → tickets → dual summaries → worktree → commit → MR and Confluence."
start: collect
maxStepVisits: 16
summaryMaxChars: 50000
steps:
  collect:
    title: Collect tickets and Slack threads
    prompt: {file: steps/sprint-triage/collect.md}
    agent: scout
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [grafana, opsbot, slack]
      extensions: []
      skills: [grafana-logs]
      bash: {mode: unrestricted}
    transitions: {ready: plan, retry: collect, blocked: $pause}
  plan:
    title: Approve KB and human-guide summaries
    prompt: {file: steps/sprint-triage/plan.md}
    agent: planner
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian]
      extensions: []
      skills: []
      bash: {mode: unrestricted}
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 30000
      artifactContract:
        maxChars: 20000
        requiredSubstrings:
          - "# Knowledge-base (LLM)"
          - "# Ledger"
          - "# the date period of all supports"
          - "# support channels"
          - "# number of tickets summarized"
          - "# number of tickets skipped due to any issue"
          - "# Human guide (Confluence)"
          - "# Slack URL"
          - "# Inquiry Summary"
          - "# Action taken to mitigate the issue"
          - "# Knowledge gained from this support"
          - "# Unknown gap"
          - "# Brief description"
          - "# Step to take an action to support inquirer"
          - "# Links/Urls to the useful guide that is related to this certain inquiry"
          - "## Publication contract"
        forbiddenSubstrings:
          - "The complete gate artifact is the exact Markdown saved at"
        onValidationFailure: retry
    transitions: {approved: checkout, changes-requested: plan, retry: plan, blocked: $pause}
  checkout:
    title: Create knowledge-base worktree
    prompt: {file: steps/sprint-triage/checkout.md}
    agent: scout
    workspace:
      bindOn: [ready]
      allowedRoots: [~/repositories/worktrees]
    permissions:
      tools: [read, ls, bash]
      mcp: []
      extensions: []
      skills: [using-git-worktrees]
      bash: {mode: unrestricted}
    transitions: {ready: implement, retry: checkout, blocked: $pause}
  implement:
    title: Commit approved KB files
    prompt: {file: steps/sprint-triage/implement.md}
    agent: worker
    permissions:
      tools: [read, ls, bash, edit, write]
      mcp: []
      extensions: []
      skills: []
      bash: {mode: unrestricted}
    transitions: {ready: publish, retry: implement, blocked: $pause}
  publish:
    title: Open MR and append Confluence
    prompt: {file: steps/sprint-triage/publish.md}
    agent: scout
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian, gitlab]
      extensions: []
      skills: []
      bash: {mode: unrestricted}
    transitions: {ready: $done, retry: publish, blocked: $pause}
