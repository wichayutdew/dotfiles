version: 1
id: sprint-triage
command: sprint-triage
description: "Collect Grafana-selected support ticket threads, summarize verified outcomes, and publish them safely. Example: /sprint-triage 2026-08-10 2026-08-21"
start: collect
maxStepVisits: 16
summaryMaxChars: 30000
steps:
  checkout:
    title: Validate targets and create a bound knowledge-base checkout
    prompt:
      file: steps/sprint-triage/checkout.md
    agent: worker
    workspace:
      bindOn:
        - ready
      allowedRoots:
        - ~/repositories/worktrees
    permissions:
      tools: [read, ls, bash, edit, write]
      mcp: []
      extensions: [/]
      skills: [using-git-worktrees, caveman]
      bash:
        mode: unrestricted
    transitions:
      ready: implement
      retry: checkout
      blocked: $pause
  collect:
    title: Collect complete support-ticket and Slack-thread evidence
    prompt:
      file: steps/sprint-triage/collect.md
    agent: scout
    permissions:
      tools: [read, ls, bash, write, mcp]
      mcp: [grafana, slack]
      extensions: [/]
      skills: [grafana-logs, caveman]
      bash:
        mode: unrestricted
    transitions:
      ready: draft
      retry: collect
      blocked: $pause
  draft:
    title: Draft redacted ticket-and-thread knowledge summaries
    prompt:
      file: steps/sprint-triage/draft.md
    agent: worker
    permissions:
      tools: [read, ls, bash, edit, write, mcp]
      mcp: [atlassian]
      extensions: [/]
      skills: [coding-standards, caveman]
      bash:
        mode: unrestricted
    transitions:
      ready: plan
      retry: draft
      blocked: $pause
  plan:
    title: Approve exact knowledge-base and Confluence publication
    prompt:
      file: steps/sprint-triage/plan.md
    agent: planner
    permissions:
      tools: [read, ls, bash, edit, write, mcp]
      mcp: [atlassian]
      extensions: [/]
      skills: [writing-plans, caveman]
      bash:
        mode: unrestricted
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 30000
    transitions:
      approved: checkout
      changes-requested: plan
      retry: plan
      blocked: $pause
  implement:
    title: Write and commit approved knowledge-base content
    prompt:
      file: steps/sprint-triage/implement.md
    agent: worker
    permissions:
      tools: [read, ls, bash, edit, write]
      mcp: []
      extensions: [/]
      skills: [coding-standards, caveman]
      bash:
        mode: unrestricted
    transitions:
      ready: verify
      retry: implement
      blocked: $pause
  verify:
    title: Independently verify approved triage content and publication preconditions
    prompt:
      file: steps/sprint-triage/verify.md
    agent: reviewer
    permissions:
      tools: [read, ls, bash, edit, write]
      mcp: []
      extensions: [/]
      skills: [verification-before-completion, caveman]
      bash:
        mode: unrestricted
    transitions:
      ready: publish
      failed: implement
      retry: verify
      blocked: $pause
  publish:
    title: Push one approved branch and publish one MR and page append
    prompt:
      file: steps/sprint-triage/publish.md
    agent: worker
    permissions:
      tools: [read, ls, bash, edit, write, mcp]
      mcp: [atlassian, gitlab]
      extensions: [/]
      skills: [commit-format, caveman]
      bash:
        mode: unrestricted
    transitions:
      ready: confirm
      retry: publish
      blocked: $pause
  confirm:
    title: Confirm the published merge request and Confluence append
    prompt:
      file: steps/sprint-triage/confirm.md
    agent: reviewer
    permissions:
      tools: [read, ls, bash, edit, write, mcp]
      mcp: [atlassian, gitlab]
      extensions: [/]
      skills: [verification-before-completion, caveman]
      bash:
        mode: unrestricted
    transitions:
      ready: $done
      retry: confirm
      blocked: $pause
