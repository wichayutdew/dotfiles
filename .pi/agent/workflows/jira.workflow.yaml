# yaml-language-server: $schema=/Users/wphongphanpa/repositories/personal/pi-workflows/schemas/workflow.schema.json
version: 1
id: jira
command: jira
description: Draft, approve, and create a Jira Epic with ordered Stories
start: draft
maxStepVisits: 12
summaryMaxChars: 30000
steps:
  draft:
    title: Normalize Epic and Story input
    prompt:
      file: steps/jira/draft.md
    subagent:
      agent: scout
      context: fresh
      timeoutMs: 1200000
      retryToolFailures: true
      turnBudget:
        maxTurns: 30
        graceTurns: 3
      toolBudget:
        soft: 60
        hard: 100
        block: "*"
    permissions:
      tools: [read, ls, bash]
      skills: &jira-draft-skills [caveman, coding-standards, brainstorming]
      bash:
        mode: allow-list
        allow:
          - executable: grep
          - executable: head
          - executable: ls
          - executable: pwd
          - executable: rg
          - executable: stat
          - executable: tail
          - executable: wc
    requires:
      tools: [read, ls, bash]
      skills: *jira-draft-skills
    transitions:
      ready: plan
      retry: draft
      blocked: $pause
  plan:
    title: Validate Jira schema and approve Epic and Story plan
    prompt:
      file: steps/jira/plan.md
    subagent:
      agent: planner
      context: fresh
      timeoutMs: 1800000
      retryToolFailures: true
      turnBudget:
        maxTurns: 45
        graceTurns: 3
      toolBudget:
        soft: 120
        hard: 200
        block: "*"
    permissions:
      tools: [read, ls, bash]
      mcp: &jira-read-mcp
        - atlassian/atlassian_getAccessibleAtlassianResources
        - atlassian/atlassian_getVisibleJiraProjects
        - atlassian/atlassian_getJiraProjectIssueTypesMetadata
        - atlassian/atlassian_getJiraIssueTypeMetaWithFields
        - atlassian/atlassian_getIssueLinkTypes
        - atlassian/atlassian_searchJiraIssuesUsingJql
        - atlassian/atlassian_getJiraIssue
      skills: &jira-plan-skills [caveman, coding-standards, brainstorming]
      bash:
        mode: allow-list
        allow:
          - executable: grep
          - executable: head
          - executable: ls
          - executable: pwd
          - executable: rg
          - executable: stat
          - executable: tail
          - executable: wc
    requires:
      tools: [read, ls, bash, mcp]
      skills: *jira-plan-skills
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 30000
    transitions:
      approved: create
      changes-requested: plan
      retry: plan
      blocked: $pause
  create:
    title: Create approved Jira Epic and Stories
    prompt:
      file: steps/jira/create.md
    subagent:
      agent: worker
      context: fresh
      timeoutMs: 1800000
      retryToolFailures: true
      turnBudget:
        maxTurns: 45
        graceTurns: 3
      toolBudget:
        soft: 100
        hard: 170
        block: "*"
    permissions:
      tools: [read, ls, bash]
      mcp: &jira-write-mcp
        - atlassian/atlassian_getAccessibleAtlassianResources
        - atlassian/atlassian_getVisibleJiraProjects
        - atlassian/atlassian_getJiraProjectIssueTypesMetadata
        - atlassian/atlassian_getJiraIssueTypeMetaWithFields
        - atlassian/atlassian_getIssueLinkTypes
        - atlassian/atlassian_getJiraIssue
        - atlassian/atlassian_createJiraIssue
        - atlassian/atlassian_editJiraIssue
        - atlassian/atlassian_createIssueLink
      skills: &jira-create-skills [caveman, coding-standards, verification-before-completion]
      bash:
        mode: allow-list
        allow:
          - executable: grep
          - executable: head
          - executable: ls
          - executable: pwd
          - executable: rg
          - executable: stat
          - executable: tail
          - executable: wc
    requires:
      tools: [read, ls, bash, mcp]
      skills: *jira-create-skills
    transitions:
      ready: $done
      retry: create
      blocked: $pause
