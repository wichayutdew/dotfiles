version: 1
id: jira
command: jira
description: "Epic + stories → approve → create in Jira."
start: draft
maxStepVisits: 12
summaryMaxChars: 30000
steps:
  draft:
    title: Normalize Epic and Story input
    prompt: {file: steps/jira/draft.md}
    agent: scout
    permissions:
      tools: [read, ls, bash]
      mcp: []
      extensions: []
      skills: []
      bash: {mode: unrestricted}
    transitions: {ready: plan, retry: draft, blocked: $pause}
  plan:
    title: Approve Epic and Stories
    prompt: {file: steps/jira/plan.md}
    agent: planner
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian]
      extensions: []
      skills: []
      bash: {mode: unrestricted}
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 30000
      artifactContract:
        maxChars: 16000
        requiredSubstrings:
          - "# Create Jira Epic and Stories"
          - "## Jira field contract"
          - "## Epic"
          - "## Ordered Stories"
          - "## Creation sequence"
          - "## Safety limits"
        forbiddenSubstrings:
          - "The complete gate artifact is the exact Markdown saved at"
        onValidationFailure: retry
    transitions: {approved: create, changes-requested: plan, retry: plan, blocked: $pause}
  create:
    title: Create approved Jira issues
    prompt: {file: steps/jira/create.md}
    agent: scout
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian]
      extensions: []
      skills: []
      bash: {mode: unrestricted}
    transitions: {ready: $done, retry: create, blocked: $pause}
